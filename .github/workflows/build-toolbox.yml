name: Build XhovoSU Toolbox

# 把 tools/xhovosu-toolbox 打包成单文件 Windows exe。
# 前端是 HTML/CSS + pywebview(WebView2)，后端是纯 Python 调 adb/fastboot。

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - '.github/workflows/build-toolbox.yml'
      - 'tools/xhovosu-toolbox/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check
        working-directory: tools/xhovosu-toolbox
        run: python -m py_compile main.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pywebview pyinstaller

      - name: Build exe
        working-directory: tools/xhovosu-toolbox
        run: |
          # spec 文件留在当前目录，否则 --add-data 的相对路径会被解析到 build/ 下
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name XhovoSU-Toolbox `
            --add-data "ui;ui" `
            --hidden-import webview.platforms.edgechromium `
            --hidden-import clr `
            --distpath dist --workpath build `
            main.py

      - name: Report
        working-directory: tools/xhovosu-toolbox
        run: |
          Get-ChildItem dist
          $f = Get-Item dist/XhovoSU-Toolbox.exe
          "SIZE={0:N2} MB" -f ($f.Length / 1MB)
          (Get-FileHash dist/XhovoSU-Toolbox.exe -Algorithm SHA256).Hash |
            Out-File dist/SHA256.txt -Encoding ASCII
          Get-Content dist/SHA256.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: XhovoSU-Toolbox
          path: |
            tools/xhovosu-toolbox/dist/XhovoSU-Toolbox.exe
            tools/xhovosu-toolbox/dist/SHA256.txt
          if-no-files-found: error
